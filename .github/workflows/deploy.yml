name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# A dispatch from any other branch runs only the gate and deploys nothing.

permissions:
  contents: read

# A deploy should finish once it started; queue the next one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate CI runs: a bad catalog must not deploy.
  gate:
    name: Gate
    uses: ./.github/workflows/test.yml

  production:
    name: Deploy production
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrangler deploy below runs the [build] block, so the Worker
      # toolchain has to be in place first.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install worker-build
        run: cargo install worker-build --version 0.9.0 --locked

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: .
          command: deploy

  staging:
    name: Deploy staging
    needs: gate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrangler deploy below runs the [build] block, so the Worker
      # toolchain has to be in place first.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install worker-build
        run: cargo install worker-build --version 0.9.0 --locked

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: .
          command: deploy --env staging
