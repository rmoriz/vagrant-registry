[package]
name = "vagrant-registry-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[build-dependencies]
# The build script compiles the source modules directly (`#[path]`, see
# build.rs); a self path dependency would be a package cycle Cargo rejects.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
